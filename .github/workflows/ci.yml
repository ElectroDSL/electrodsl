name: ElectroDSL CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Check 1.0 Reference Project
        run: node packages/cli/dist/index.js project check examples/project-v1.0 --format sarif > quality.sarif

      - name: Build and Verify 1.0 Reference Project
        run: |
          node packages/cli/dist/index.js project build examples/project-v1.0
          node packages/cli/dist/index.js project verify examples/project-v1.0

      - name: Upload Quality Interchange Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electrodsl-quality
          path: |
            quality.sarif
            examples/project-v1.0/build/quality.junit.xml
            examples/project-v1.0/build/project.json
