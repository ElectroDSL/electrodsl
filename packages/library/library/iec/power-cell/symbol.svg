<svg
xmlns="http://www.w3.org/2000/svg"
width="80"
height="120"
viewBox="0 0 80 120">


<!-- Positive terminal -->

<line
x1="40"
y1="0"
x2="40"
y2="20"
stroke="black"
stroke-width="2"/>


<!-- Battery plates -->

<line
x1="20"
y1="35"
x2="60"
y2="35"
stroke="black"
stroke-width="4"/>


<line
x1="30"
y1="55"
x2="50"
y2="55"
stroke="black"
stroke-width="4"/>


<!-- Negative terminal -->

<line
x1="40"
y1="55"
x2="40"
y2="100"
stroke="black"
stroke-width="2"/>


<!-- labels -->

<text
x="65"
y="38"
font-size="14">
+
</text>


<text
x="65"
y="58"
font-size="14">
-
</text>


</svg>